version: '3.8'

services:
  psy-vibe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psy-vibe-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
